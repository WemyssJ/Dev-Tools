title:
  en_us: Update
tooltip:
  en_us: >-
    Downloads updates from the remote github repository
      Version History:
      - 1.0.00: Useful pyRevit tools + 'Export DocReg'', 'Strip Model', 'Pile E+N', 'Pile Renumbering', 'Disable Analytical', 'Quick Links'
      - 1.0.01: 'Tag Align' and 'E+N+ZUpToDate' added
      - 1.0.02: 'Pile Renumbering' reliance on GeniusLoci Removed, 'Disable Analytical' and 'Print Sheets'. moved to bin, PackagesUsed.txt added to all custom tools
      - 1.0.03: 'Pile Renumbering' Now allows starting number and outputs number of piles renamed. 'Pile E+N' also outputs number of piles coordinated
      - 1.0.04: 'Pad Renumbering' added
      - 1.0.05: 'Pile Renumbering' Now only renames STRUCTURAL FOUNDATIONS with a type name "Pile" rather than containing "Pile"
      - 1.0.06: Hooks removed (moved to BIMTools)
      - 1.0.07: 'E+N+Z UpToDate' fixed
      - 1.0.08: BIM Guidance and Revit 2024 quick links added
      - 1.0.09: Strip Model now maintains '3D Coversheet', DocReg updated to suit new file naming protocol
      - 1.0.10: Sync Views added
      - 1.0.11: Strip Model improved. UI overhaul
      - 1.0.12: Autodesk ID removed from strip model naming
      - 1.0.13: Strip model naming reoganised

      Current Version 1.0.14
      - 1.0.14: View/Sheet renaming added, Warnings added
context: zero-doc
